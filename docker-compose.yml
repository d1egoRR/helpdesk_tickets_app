services:
  api:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./docs:/app/docs:ro
      - chroma_db:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_db:
